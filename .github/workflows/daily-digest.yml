name: Daily Digest Email

# 前回送信以降にキャプチャされた記事をカテゴリごとに1通ずつ、
# 批評コメント（Claude優先・Geminiフォールバック）付きでメール送信する。
# 量子（Frontier）は日次配信から分離し、weekly-quantum-digest.yml が土曜週次で扱う
# （検出自体は量子ノートも拾うが、build_digest.py内でカテゴリ判定して日次送信から除外する）。
# キャプチャルーチン（クラウドルーチン）は毎朝2:08〜2:15 JSTに完了済み
# （2026-08-19に7:13頃から02:00 JSTへ移動）。配信はその5時間半後を狙う。
#
# cronを2本持たせている。GitHub Actionsのスケジュール実行は優先度が低く、
# 混雑時は遅延・脱落するため（通常は15〜22分の遅延だが、2026-08-26の回は
# 4時間54分遅れて12:29 JST着になり「朝メールが来ない」事象が発生した）。
#   1本目 22:35 UTC = 7:35 JST … 本命
#   2本目 23:20 UTC = 8:20 JST … 保険
# 2本目は安全に空振りする。以降の全ステップが `if: count != '0'` で
# ガードされており、本命が成功していれば .digest-state が進んでいるため
# 検出0件となり何も送信しない（concurrency も効くので競合もしない）。
# 検出0件のときは、巡回ログを見て「本当に取得失敗だったのか」を判定し、
# 異常な0件のときだけ通知メールを送る（2026-09-08追加。egress遮断による
# 0件が月3〜4回起きているのに、こちらから気づく手段が無かったため）。
on:
  schedule:
    - cron: "35 22 * * *"
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect files captured since last digest
        id: files
        run: |
          # .digest-stateはコミットSHAを保持する（タイムスタンプ比較はマージコミットで
          # 追加されたファイルを検出できないため廃止。2026-07-15の取りこぼし事故対策）
          BASE=$(cat .digest-state 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Diffing from $BASE to HEAD"
          FILES=$(git diff --name-status --diff-filter=A "$BASE" HEAD -- '00-Inbox/*.md' \
            | awk '{print $2}' | { grep -v README || true; } | sort -u \
            | while read -r f; do [ -f "$f" ] && echo "$f"; done | tr '\n' ' ')
          COUNT=$(echo $FILES | wc -w | tr -d ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Detected $COUNT file(s): $FILES"

      # ここから0件時の通知。0件は必ずしも異常ではない点に注意する——
      # 保険cron（8:20 JST）は本命cronが送信に成功した後も常に0件になるため、
      # 巡回ログ digests/YYYY-MM-DD-sources.md を見て理由を判定し、
      # 本当に異常なときだけ通知する。.alert-state で同日の二重送信も防ぐ。
      # 巡回ログの日付Dは「直近のキャプチャ実行日(UTC)」であって date -u の今日ではない。
      # キャプチャは毎日17:00 UTCに走る。配信cronは22:35/23:20 UTCだが、
      # GitHub Actionsのスケジュール実行は常に50〜115分遅れて起動しており、
      # 実測8回すべてが00:00 UTCを跨いで翌日に入っていた（2026-09-10調査）。
      # そのため date -u をそのまま使うと D が必ず1日先にずれ、
      #   - 巡回ログが必ず見つからず reason が常に no-log になる
      #   - 「成功行あり→通知しない」分岐に到達できず、正常日に保険cronが誤発報する
      # という二重の不具合になる。17:00 UTC を境に日付を決めることでズレを消す。
      - name: Detect capture failure
        id: failure
        if: steps.files.outputs.count == '0'
        run: |
          if [ "$(date -u +%H)" -ge 17 ]; then
            D=$(date -u +%Y-%m-%d)
          else
            D=$(date -u -d yesterday +%Y-%m-%d)
          fi
          echo "Derived capture date: $D (now $(date -u +%Y-%m-%dT%H:%M:%SZ))"
          LOG="digests/$D-sources.md"
          echo "date=$D" >> $GITHUB_OUTPUT
          if [ "$(cat .alert-state 2>/dev/null)" = "$D" ]; then
            echo "Already alerted for $D"
            echo "reason=" >> $GITHUB_OUTPUT
          elif [ ! -f "$LOG" ]; then
            echo "No source log for $D"
            echo "reason=no-log" >> $GITHUB_OUTPUT
          elif ! grep -qE '\|[[:space:]]*OK[[:space:]]*\|' "$LOG"; then
            echo "All sources failed on $D"
            echo "reason=all-failed" >> $GITHUB_OUTPUT
          else
            # 巡回ログに成功行がある＝取得はできていた。本命送信後の保険cron等
            echo "Capture succeeded on $D; nothing to alert"
            echo "reason=" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.failure.outputs.reason != ''
        with:
          python-version: "3.12"

      - name: Send capture failure notification
        if: steps.failure.outputs.reason != ''
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 scripts/notify_capture_failure.py \
            "${{ steps.failure.outputs.date }}" "${{ steps.failure.outputs.reason }}"

      - name: Record alert state
        if: steps.failure.outputs.reason != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ steps.failure.outputs.date }}" > .alert-state
          git add .alert-state
          git commit -m "chore: update alert state"
          git pull --rebase origin main && git push

      - uses: actions/setup-python@v5
        if: steps.files.outputs.count != '0'
        with:
          python-version: "3.12"

      - name: Install rsvg-convert (for heatmap PNG embedding)
        if: steps.files.outputs.count != '0'
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-cjk

      - name: Build and send digest emails
        if: steps.files.outputs.count != '0'
        id: digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/build_digest.py ${{ steps.files.outputs.files }}

      # 送信済み時点のコミットSHAを記録（次回はこのSHA以降に追加されたファイルだけを対象にする）
      - name: Update digest state
        if: steps.files.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rev-parse HEAD > .digest-state
          git add .digest-state
          git commit -m "chore: update digest state"
          git pull --rebase origin main && git push
