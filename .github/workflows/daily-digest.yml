name: Daily Digest Email

# 前回送信以降にキャプチャされた記事をカテゴリごとに1通ずつ、
# 批評コメント（Claude優先・Geminiフォールバック）付きでメール送信する。
# 量子（Frontier）は日次配信から分離し、weekly-quantum-digest.yml が土曜週次で扱う
# （検出自体は量子ノートも拾うが、build_digest.py内でカテゴリ判定して日次送信から除外する）。
# キャプチャルーチン（クラウドルーチン）は毎朝2:08〜2:15 JSTに完了済み
# （2026-08-19に7:13頃から02:00 JSTへ移動）。配信はその5時間半後を狙う。
#
# cronを2本持たせている。GitHub Actionsのスケジュール実行は優先度が低く、
# 混雑時は遅延・脱落するため（通常は15〜22分の遅延だが、2026-08-26の回は
# 4時間54分遅れて12:29 JST着になり「朝メールが来ない」事象が発生した）。
#   1本目 22:35 UTC = 7:35 JST … 本命
#   2本目 23:20 UTC = 8:20 JST … 保険
# 2本目は安全に空振りする。以降の全ステップが `if: count != '0'` で
# ガードされており、本命が成功していれば .digest-state が進んでいるため
# 検出0件となり何も送信しない（concurrency も効くので競合もしない）。
on:
  schedule:
    - cron: "35 22 * * *"
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect files captured since last digest
        id: files
        run: |
          # .digest-stateはコミットSHAを保持する（タイムスタンプ比較はマージコミットで
          # 追加されたファイルを検出できないため廃止。2026-07-15の取りこぼし事故対策）
          BASE=$(cat .digest-state 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Diffing from $BASE to HEAD"
          FILES=$(git diff --name-status --diff-filter=A "$BASE" HEAD -- '00-Inbox/*.md' \
            | awk '{print $2}' | { grep -v README || true; } | sort -u \
            | while read -r f; do [ -f "$f" ] && echo "$f"; done | tr '\n' ' ')
          COUNT=$(echo $FILES | wc -w | tr -d ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Detected $COUNT file(s): $FILES"

      - uses: actions/setup-python@v5
        if: steps.files.outputs.count != '0'
        with:
          python-version: "3.12"

      - name: Install rsvg-convert (for heatmap PNG embedding)
        if: steps.files.outputs.count != '0'
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-cjk

      - name: Build and send digest emails
        if: steps.files.outputs.count != '0'
        id: digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/build_digest.py ${{ steps.files.outputs.files }}

      # 送信済み時点のコミットSHAを記録（次回はこのSHA以降に追加されたファイルだけを対象にする）
      - name: Update digest state
        if: steps.files.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rev-parse HEAD > .digest-state
          git add .digest-state
          git commit -m "chore: update digest state"
          git pull --rebase origin main && git push
