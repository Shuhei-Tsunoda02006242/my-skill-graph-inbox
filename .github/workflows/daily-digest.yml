name: Daily Digest Email

on:
  push:
    branches: [main]
    paths:
      - "00-Inbox/**.md"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build digest body
        id: digest
        run: |
          # push時は差分ファイル、手動実行時はInbox全件を対象にする
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_FILES=$(ls 00-Inbox/*.md 2>/dev/null | grep -v README)
            SUBJECT_SUFFIX="手動実行 — Inbox全件"
          else
            TARGET_FILES=$(git diff --name-only HEAD~1 HEAD -- '00-Inbox/*.md' | grep -v README)
            SUBJECT_SUFFIX="新着"
          fi

          COUNT=$(echo "$TARGET_FILES" | grep -c '\.md' || true)
          TODAY=$(date '+%Y-%m-%d')

          BODY="📥 Skill Graph Inbox ${SUBJECT_SUFFIX} ${COUNT}件（${TODAY}）\n\n"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            TITLE=$(grep '^title:' "$file" | sed 's/title: *"\?\(.*\)"\?/\1/' | tr -d '"')
            CLAIM=$(awk '/^## 主な主張/{found=1; next} found && /^##/{exit} found{print}' "$file" | sed '/^$/d' | head -5)
            IMPLICATION=$(grep '^investment-implication:' "$file" | sed 's/investment-implication: *"\?\(.*\)"\?/\1/' | tr -d '"')
            SIGNAL=$(grep '^signal-strength:' "$file" | sed 's/signal-strength: *//')

            BODY="${BODY}---\n"
            BODY="${BODY}📌 ${TITLE}\n"
            BODY="${BODY}シグナル強度: ${SIGNAL}\n\n"
            BODY="${BODY}【主な主張】\n${CLAIM}\n\n"
            BODY="${BODY}【投資含意】\n${IMPLICATION}\n\n"
          done <<< "$TARGET_FILES"

          echo "count=${COUNT}" >> $GITHUB_OUTPUT
          echo "suffix=${SUBJECT_SUFFIX}" >> $GITHUB_OUTPUT
          {
            echo "body<<EOF"
            echo -e "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "📥 Skill Graph ${{ steps.digest.outputs.suffix }} ${{ steps.digest.outputs.count }}件"
          to: ${{ secrets.GMAIL_USERNAME }}
          from: Skill Graph Inbox <${{ secrets.GMAIL_USERNAME }}>
          body: ${{ steps.digest.outputs.body }}
          content_type: text/plain; charset=utf-8
