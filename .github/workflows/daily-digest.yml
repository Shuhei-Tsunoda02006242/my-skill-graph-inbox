name: Daily Digest Email

# 1日1通、直近24時間にキャプチャされた全ソースの記事を
# ソース別にまとめ、Gemini批評コメントを付けてメール送信する。
# 10:00 JST = 01:00 UTC（8:57開始のローカルキャプチャ完了後を想定）
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect files captured since last digest
        id: files
        run: |
          SINCE=$(cat .digest-state 2>/dev/null || echo "24 hours ago")
          echo "Looking for files added since: $SINCE"
          FILES=$(git log --since="$SINCE" --diff-filter=A --name-only --pretty=format: -- '00-Inbox/*.md' \
            | { grep -v README || true; } | sort -u \
            | while read -r f; do [ -f "$f" ] && echo "$f"; done | tr '\n' ' ')
          COUNT=$(echo $FILES | wc -w | tr -d ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Detected $COUNT file(s): $FILES"

      - uses: actions/setup-python@v5
        if: steps.files.outputs.count != '0'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.files.outputs.count != '0'
        run: pip install -q deep-translator

      - name: Translate to Japanese
        if: steps.files.outputs.count != '0'
        run: python3 scripts/translate_inbox.py ${{ steps.files.outputs.files }}

      - name: Commit translated files
        if: steps.files.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 00-Inbox/
          if git diff --staged --quiet; then
            echo "Already translated, nothing to commit"
          else
            git commit -m "translate: Inbox notes to Japanese"
            git pull --rebase origin main && git push
          fi

      - name: Build digest body
        if: steps.files.outputs.count != '0'
        id: digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/build_digest.py ${{ steps.files.outputs.files }}

      - name: Send email
        if: steps.files.outputs.count != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.digest.outputs.subject }}
          to: ${{ secrets.GMAIL_USERNAME }}
          from: Skill Graph Inbox <${{ secrets.GMAIL_USERNAME }}>
          body: file://digest_body.txt
          content_type: text/plain; charset=utf-8

      # 送信済み時点を記録（次回はこれ以降に追加されたファイルだけを対象にする）
      - name: Update digest state
        if: steps.files.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > .digest-state
          git add .digest-state
          git commit -m "chore: update digest state"
          git pull --rebase origin main && git push
