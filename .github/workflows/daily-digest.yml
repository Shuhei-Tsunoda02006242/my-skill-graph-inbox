name: Daily Digest Email

on:
  push:
    branches: [main]
    paths:
      - "00-Inbox/**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect target files
        id: files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES=$(ls 00-Inbox/*.md 2>/dev/null | grep -v README | tr '\n' ' ')
            SUFFIX="手動実行 — Inbox全件"
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- '00-Inbox/*.md' | grep -v README | tr '\n' ' ')
            SUFFIX="新着"
          fi
          # ファイル名（YYYY-MM-DD-{prefix}-slug）からソース名を判定
          FIRST=$(echo $FILES | awk '{print $1}' | xargs -I{} basename {})
          if echo "$FIRST" | grep -q -- '-tc-'; then SOURCE="TechCrunch"
          elif echo "$FIRST" | grep -q -- '-tm-'; then SOURCE="Techmeme"
          elif echo "$FIRST" | grep -q -- '-sn-'; then SOURCE="STAT News"
          elif echo "$FIRST" | grep -q -- '-is-'; then SOURCE="IEEE Spectrum"
          else SOURCE="Skill Graph"
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "count=$(echo $FILES | wc -w)" >> $GITHUB_OUTPUT
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q deep-translator

      - name: Translate to Japanese
        run: |
          FILES="${{ steps.files.outputs.files }}"
          if [ -n "$FILES" ]; then
            python3 scripts/translate_inbox.py $FILES
          fi

      - name: Commit translated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 00-Inbox/
          if git diff --staged --quiet; then
            echo "Already translated, nothing to commit"
          else
            git commit -m "translate: Inbox notes to Japanese"
            git pull --rebase origin main && git push
          fi

      - name: Build digest body
        id: digest
        run: |
          TODAY=$(date '+%Y-%m-%d')
          BODY="📥 Skill Graph Inbox ${{ steps.files.outputs.suffix }} ${{ steps.files.outputs.count }}件（${TODAY}）\n\n"

          for file in ${{ steps.files.outputs.files }}; do
            [ -f "$file" ] || continue
            TITLE=$(grep '^title:' "$file" | sed 's/title: *"\?\(.*\)"\?/\1/' | tr -d '"')
            CLAIM=$(awk '/^## 主な主張/{found=1; next} found && /^##/{exit} found{print}' "$file" | sed '/^$/d' | head -5)
            IMPLICATION=$(grep '^investment-implication:' "$file" | sed 's/investment-implication: *"\?\(.*\)"\?/\1/' | tr -d '"')
            SIGNAL=$(grep '^signal-strength:' "$file" | sed 's/signal-strength: *//')
            URL=$(grep '^source:' "$file" | sed 's/source: *"\?\(.*\)"\?/\1/' | tr -d '"')
            BODY="${BODY}---\n📌 ${TITLE}\nシグナル強度: ${SIGNAL}\n\n【主な主張】\n${CLAIM}\n\n【投資含意】\n${IMPLICATION}\n\n🔗 ${URL}\n\n"
          done

          {
            echo "body<<EOF"
            echo -e "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "📥 [${{ steps.files.outputs.source }}] ${{ steps.files.outputs.suffix }} ${{ steps.files.outputs.count }}件"
          to: ${{ secrets.GMAIL_USERNAME }}
          from: Skill Graph Inbox <${{ secrets.GMAIL_USERNAME }}>
          body: ${{ steps.digest.outputs.body }}
          content_type: text/plain; charset=utf-8
