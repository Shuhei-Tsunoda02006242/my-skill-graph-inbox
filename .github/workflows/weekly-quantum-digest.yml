name: Weekly Quantum Digest

# Frontier（量子）は日次配信から分離し、土曜週次サマリー1通
# （1行ヘッドライン形式＋Gemini総括＋量子ヒートマップ）を送信する。
# cronは金曜22:35 UTC = 土曜7:35 JST起動。GitHub Actionsのスケジュール遅延
# （毎時00分は混雑で40分超、半端な分でも5〜20分程度の遅延が直近7日間で実測）を
# 織り込んでおり、実配信は土曜8:00 JST前後になる想定。
# 対象は WEEKLY_QUANTUM=1 起動時にスクリプト自身が 00-Inbox/*.md をファイル名の
# 日付でスキャンして選定するため、.digest-state には依存しない。
on:
  schedule:
    - cron: "35 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-quantum-digest
  cancel-in-progress: false

jobs:
  send-weekly-quantum-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rsvg-convert (for heatmap PNG embedding)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-cjk

      - name: Build and send weekly quantum digest
        env:
          WEEKLY_QUANTUM: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/build_digest.py

      # 指標更新・初出用語表示があった週だけ docs/*.json に差分が出る（無い週は何もしない）。
      # `git diff --quiet` はcheckout直後にまだgit管理下に無いファイル（未追跡）の
      # 新規作成を検出できないため、未追跡も含めて拾える `git status --porcelain` を使う
      - name: Commit updated quantum milestones/glossary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CHANGED=$(git status --porcelain -- docs/quantum-milestones.json docs/quantum-glossary.json)
          if [ -z "$CHANGED" ]; then
            echo "差分なし。スキップ"
            exit 0
          fi
          git add docs/quantum-milestones.json docs/quantum-glossary.json
          git commit -m "chore: 量子週次の指標・用語集を更新"
          # 日次キャプチャが毎日mainへpushしているため、checkout時点のmainは
          # ほぼ確実に古い。rebaseしてからでないとnon-fast-forwardで弾かれる
          git pull --rebase origin main
          git push origin main
